[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emulite"
version = "0.1.0"
description = "Emulite is an emulation framework for Android native libraries, inspired by unidbg. iOS support is planned."
requires-python = ">=3.10"
dependencies = [
    "lief>=0.14",
    "unicorn>=2.1.4",
    "cryptography>=42",
    "capstone>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/emulite"]

[tool.ruff]
line-length = 100
