[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emulite"
version = "0.1.0"
description = "Emulation framework for Android & iOS native libraries"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lief>=0.14",
    "unicorn>=2.1.4",
    "cryptography>=42",
    "capstone>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.urls]
Repository = "https://github.com/retrowave3/emulite"
Issues = "https://github.com/retrowave3/emulite/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/emulite"]

[tool.hatch.build.targets.wheel.force-include]
"rootfs/android" = "emulite/rootfs/android"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/rootfs/android",
    "/README.md",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
